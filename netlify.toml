[build]
  # Repo root. Overrides the old "_site" base directory still set in the
  # Netlify UI from the Quarto days (that folder no longer exists).
  base = "/"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Long cache for fonts and vendored libraries; HTML stays fresh.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
